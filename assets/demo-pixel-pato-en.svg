<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Landing page mockup for the made-up game Pixel Pato</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset=".55" stop-color="#ff7aa8"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ffd23f"/><rect x="8" width="8" height="16" fill="#1b1b2f"/>
    </pattern>
  </defs>

  <!-- fundo da "mesa" -->
  <rect width="960" height="540" fill="#eef3ff"/>

  <!-- janela do navegador -->
  <rect x="60" y="40" width="840" height="470" rx="18" fill="#ffffff" stroke="#c4d4fb" stroke-width="4"/>
  <rect x="60" y="40" width="840" height="48" rx="18" fill="#dfe8ff"/>
  <rect x="60" y="70" width="840" height="18" fill="#dfe8ff"/>
  <circle cx="92" cy="64" r="8" fill="#ff5d8f"/><circle cx="118" cy="64" r="8" fill="#ffc93c"/><circle cx="144" cy="64" r="8" fill="#4be08a"/>
  <rect x="180" y="52" width="420" height="24" rx="12" fill="#ffffff"/>
  <text x="200" y="69" font-family="Fredoka, Arial, sans-serif" font-size="14" fill="#4a5a8f">pixelpato.example</text>

  <!-- hero da landing -->
  <clipPath id="win"><rect x="64" y="88" width="832" height="418" rx="0"/></clipPath>
  <g clip-path="url(#win)">
    <rect x="64" y="88" width="832" height="418" fill="url(#sky)"/>
    <!-- sol e colinas pixeladas -->
    <rect x="690" y="130" width="96" height="96" fill="#fff3b0"/>
    <path d="M64 420h120v-24h80v-24h96v24h72v-32h120v32h80v-24h104v24h160v130H64z" fill="#3c2a78"/>
    <path d="M64 452h160v-20h120v20h140v-28h96v28h120v-20h196v90H64z" fill="#24174f"/>

    <!-- pato pixelado -->
    <g transform="translate(600 250)" shape-rendering="crispEdges">
      <rect x="40" y="0" width="60" height="50" fill="#ffd23f"/>
      <rect x="0" y="50" width="120" height="60" fill="#ffd23f"/>
      <rect x="20" y="110" width="80" height="20" fill="#ffd23f"/>
      <rect x="100" y="20" width="40" height="20" fill="#ff8c2b"/>
      <rect x="70" y="14" width="14" height="14" fill="#1b1b2f"/>
      <rect x="30" y="70" width="50" height="24" fill="#f2b705"/>
      <rect x="30" y="130" width="14" height="20" fill="#ff8c2b"/><rect x="76" y="130" width="14" height="20" fill="#ff8c2b"/>
    </g>

    <!-- textos da landing -->
    <text x="120" y="200" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="68" font-weight="700" fill="#ffffff" stroke="#24174f" stroke-width="6" paint-order="stroke">PIXEL PATO</text>
    <text x="122" y="240" font-family="Fredoka, Arial, sans-serif" font-size="22" fill="#24174f">A platformer that does not exist (yet).</text>
    <rect x="120" y="270" width="230" height="52" rx="26" fill="#24174f"/>
    <text x="235" y="303" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffd23f">Wishlist now ▸</text>
    <rect x="364" y="270" width="150" height="52" rx="26" fill="none" stroke="#24174f" stroke-width="3"/>
    <text x="439" y="303" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="19" font-weight="600" fill="#24174f">Press kit</text>
  </g>

  <!-- faixa "exemplo fictício" -->
  <g transform="rotate(-8 480 270)">
    <rect x="300" y="380" width="360" height="56" fill="url(#stripes)" stroke="#1b1b2f" stroke-width="4"/>
    <rect x="322" y="390" width="316" height="36" fill="#1b1b2f"/>
    <text x="480" y="415" text-anchor="middle" font-family="Fredoka, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#ffd23f">FICTIONAL EXAMPLE</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
