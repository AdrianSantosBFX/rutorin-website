<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b206e">
  <title>404 · Game over · Rutorin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .page-404{min-height:100svh;display:grid;place-items:center;padding:2rem;text-align:center;color:#fff;background:linear-gradient(180deg,rgba(9,37,121,.92),rgba(19,58,186,.9)),url("/assets/gamer-pattern.webp") center/560px auto;background-color:#133aba}
    .page-404 .brand-404{width:150px;margin:0 auto 2rem;display:block}
    .page-404 .code{font-size:clamp(5rem,18vw,9rem);font-weight:700;line-height:1;-webkit-text-stroke:6px #060e4c;paint-order:stroke fill;margin:0}
    .page-404 h1{margin:.4rem 0 .8rem;font-size:clamp(1.8rem,4vw,2.6rem)}
    .page-404 p{margin:0 auto 1.8rem;max-width:460px;color:#dce8ff;font-size:1.1rem;line-height:1.5}
    .page-404 .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    .page-404 .lives{display:inline-flex;gap:6px;margin-bottom:1rem}
    .page-404 p.code{margin:0 auto;max-width:none;width:100%;text-align:center;color:#fff}
    .page-404 .lives svg{width:22px;height:22px;color:#3a4a8a;shape-rendering:crispEdges}
  </style>
</head>
<body>
  <main class="page-404">
    <div>
      <a href="/"><img class="brand-404" src="/assets/rutorin-logo.webp" alt="Rutorin" width="600" height="152"></a>
      <span class="lives" aria-hidden="true">
        <svg viewBox="0 0 7 7"><path d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1Z" fill="currentColor"/></svg>
        <svg viewBox="0 0 7 7"><path d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1Z" fill="currentColor"/></svg>
        <svg viewBox="0 0 7 7"><path d="M1 0h2v1h1V0h2v1h1v3H6v1H5v1H4v1H3V6H2V5H1V4H0V1h1Z" fill="currentColor"/></svg>
      </span>
      <p class="code">404</p>
      <h1>Game over: esta fase não existe.</h1>
      <p>A página que você procurou não foi encontrada. <span lang="en">This page doesn't exist.</span></p>
      <div class="actions">
        <a class="button button-primary" href="/">Voltar ao início</a>
        <a class="button button-secondary" href="/en/" lang="en">Go to English site</a>
      </div>
    </div>
  </main>
</body>
</html>
